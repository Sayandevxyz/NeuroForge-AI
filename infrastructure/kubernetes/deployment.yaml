apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroforge-api
  labels:
    app: neuroforge-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuroforge-api
  template:
    metadata:
      labels:
        app: neuroforge-api
    spec:
      containers:
      - name: api
        image: cr.nebius.ai/neuroforge/api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: neuroforge-secrets
              key: database-url
        - name: DEMO_MODE
          value: "true"
        - name: GPU_PROVIDER
          value: "nebius"
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: neuroforge-api-svc
spec:
  selector:
    app: neuroforge-api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
